---
# Timezone is presentation; chrony keeps the clock correct. Both matter for
# Week-3 incident timelines (week1/README.md §18).
common_timezone: Africa/Johannesburg

common_packages:
  - chrony
  - curl
  - jq
  - rsync
  - tar
  - python3-libselinux
  - policycoreutils-python-utils

# Members' PUBLIC SSH keys for the bootstrap user, set in the private
# inventory (group_vars/all.yml): [{name: <member>, key: "ssh-ed25519 ..."}].
# Additive only: the Terraform keypair stays, so nobody is locked out.
common_authorized_keys: []
