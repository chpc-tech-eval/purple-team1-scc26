---
- name: Require firewall inputs from the private inventory
  ansible.builtin.assert:
    that:
      - firewall_ssh_cidrs is defined and firewall_ssh_cidrs | length > 0
      - firewall_dns_cidrs is defined and firewall_dns_cidrs | length > 0
      - firewall_vpn_cidr is defined
      - firewall_private_cidrs is defined and firewall_private_cidrs | length > 0
      - firewall_wireguard_port is defined
      - "'0.0.0.0/0' not in firewall_ssh_cidrs"
    fail_msg: Set the firewall_* variables in inventories/private (see roles/firewall/defaults/main.yml).

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Refuse to run alongside an active firewalld
  ansible.builtin.assert:
    that:
      - ansible_facts.services['firewalld.service'] is not defined
        or ansible_facts.services['firewalld.service'].state != 'running'
    fail_msg: >-
      firewalld is running. Replacing it with nftables is a team decision; do
      not stop it from this role. Agree it on #13 first.

# Lockout guard (captain review on #27): established sessions survive a reload,
# but the NEXT run would be refused if this controller's address is missing.
- name: Read this controller's SSH source address (no privilege escalation)
  ansible.builtin.setup:
    gather_subset: [env]
  become: false

- name: Refuse a ruleset that would lock out the current controller
  vars:
    firewall_controller_ip: "{{ ansible_facts.env.SSH_CONNECTION.split()[0] }}"
  ansible.builtin.assert:
    that:
      - firewall_ssh_cidrs | map('ansible.utils.network_in_network', firewall_controller_ip) | select | list | length > 0
    fail_msg: >-
      This controller's SSH source is not in firewall_ssh_cidrs; applying the
      ruleset would lock it out of edge-01 on the next run. Add it first.
  when: ansible_facts.env.SSH_CONNECTION is defined

- name: Install nftables
  ansible.builtin.dnf:
    name: nftables
    state: present

- name: Deploy the edge ruleset (checked with nft -c before it lands)
  ansible.builtin.template:
    src: scc26-edge.nft.j2
    dest: "{{ firewall_ruleset_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Load only our ruleset from the nftables service
  ansible.builtin.copy:
    dest: /etc/sysconfig/nftables.conf
    content: |
      # Managed by Ansible (infrastructure/ansible/roles/firewall)
      include "{{ firewall_ruleset_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
