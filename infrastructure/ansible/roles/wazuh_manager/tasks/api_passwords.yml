---
# Replace the default Wazuh API passwords (wazuh:wazuh, wazuh-wui:wazuh-wui).
# Idempotent: each user is only changed while its new password is not yet
# accepted. Passwords come from Ansible Vault and are never logged.
- name: Try the new password for the API admin user
  ansible.builtin.uri:
    url: "https://127.0.0.1:55000/security/user/authenticate"
    method: POST
    url_username: wazuh
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: wazuh_manager_api_admin_new
  no_log: true
  check_mode: false  # read-only login probe; lets --check see the real state

- name: Change the API admin password away from the default
  when: wazuh_manager_api_admin_new.status == 401
  no_log: true
  block:
    - name: Authenticate with the default admin password
      ansible.builtin.uri:
        url: "https://127.0.0.1:55000/security/user/authenticate"
        method: POST
        url_username: wazuh
        url_password: wazuh
        force_basic_auth: true
        validate_certs: false
      register: wazuh_manager_api_admin_default

    - name: Look up the admin user id
      ansible.builtin.uri:
        url: "https://127.0.0.1:55000/security/users?search=wazuh&limit=10"
        headers:
          Authorization: "Bearer {{ wazuh_manager_api_admin_default.json.data.token }}"
        validate_certs: false
      register: wazuh_manager_api_users_default

    - name: Set the new admin password
      vars:
        wazuh_manager_admin_id: "{{ (wazuh_manager_api_users_default.json.data.affected_items | selectattr('username', 'equalto', 'wazuh') | first).id }}"
      ansible.builtin.uri:
        url: "https://127.0.0.1:55000/security/users/{{ wazuh_manager_admin_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ wazuh_manager_api_admin_default.json.data.token }}"
        body_format: json
        body:
          password: "{{ wazuh_api_password }}"
        validate_certs: false

- name: Authenticate as the API admin with the new password
  ansible.builtin.uri:
    url: "https://127.0.0.1:55000/security/user/authenticate"
    method: POST
    url_username: wazuh
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
  register: wazuh_manager_api_admin
  no_log: true
  check_mode: false  # read-only login probe; lets --check see the real state

- name: Try the new password for the dashboard API user
  ansible.builtin.uri:
    url: "https://127.0.0.1:55000/security/user/authenticate"
    method: POST
    url_username: wazuh-wui
    url_password: "{{ wazuh_wui_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: wazuh_manager_api_wui_new
  no_log: true
  check_mode: false  # read-only login probe; lets --check see the real state

- name: Change the dashboard API user password away from the default
  when: wazuh_manager_api_wui_new.status == 401
  no_log: true
  block:
    - name: Look up the wazuh-wui user id
      ansible.builtin.uri:
        url: "https://127.0.0.1:55000/security/users?search=wazuh-wui&limit=10"
        headers:
          Authorization: "Bearer {{ wazuh_manager_api_admin.json.data.token }}"
        validate_certs: false
      register: wazuh_manager_api_users

    - name: Set the new wazuh-wui password
      vars:
        wazuh_manager_wui_id: "{{ (wazuh_manager_api_users.json.data.affected_items | selectattr('username', 'equalto', 'wazuh-wui') | first).id }}"
      ansible.builtin.uri:
        url: "https://127.0.0.1:55000/security/users/{{ wazuh_manager_wui_id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ wazuh_manager_api_admin.json.data.token }}"
        body_format: json
        body:
          password: "{{ wazuh_wui_password }}"
        validate_certs: false

- name: The default API passwords are rejected now
  ansible.builtin.uri:
    url: "https://127.0.0.1:55000/security/user/authenticate"
    method: POST
    url_username: "{{ item }}"
    url_password: "{{ item }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [401]
  loop: [wazuh, wazuh-wui]
  check_mode: false  # read-only login probe; lets --check see the real state
