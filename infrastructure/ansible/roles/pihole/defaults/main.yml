---
# Pi-hole DNS on edge-01 as a Podman Quadlet, host networking (port 53).
# Fully qualified image, pinned by tag AND digest: never a short name.
pihole_image: docker.io/pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
pihole_data_dir: /opt/pihole
pihole_timezone: Africa/Johannesburg
# ALL is safe here because nftables limits port 53 to firewall_dns_cidrs;
# LOCAL would refuse the VPN and k8s networks (not on edge's own subnet).
pihole_listening_mode: ALL
pihole_secret_name: pihole_web_password
#
# Required in the private inventory (no defaults, asserted):
# pihole_local_domain:   internal DNS domain (team decision, #13)
# pihole_dns_upstreams:  list of upstream resolvers
# pihole_dns_hosts:      list of "<ip> <fqdn> <short>" records for the five hosts
# pihole_web_password:   UI password, from Ansible Vault only
