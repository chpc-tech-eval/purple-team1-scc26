---
- name: Require Pi-hole inputs from the private inventory
  ansible.builtin.assert:
    that:
      - pihole_local_domain is defined
      - pihole_dns_upstreams is defined and pihole_dns_upstreams | length > 0
      - pihole_dns_hosts is defined
      - pihole_web_password is defined and pihole_web_password | length >= 12
    fail_msg: Set the pihole_* variables in inventories/private (password via Ansible Vault).
  no_log: true

- name: Install Podman
  ansible.builtin.dnf:
    name: podman
    state: present

# The container chowns etc-pihole to its own user on every start, so Ansible
# only creates the directory when it is missing and never re-owns it
# (Olerato's finding A on #13: recurring change + pihole unable to traverse).
- name: Check for the Pi-hole data directory
  ansible.builtin.stat:
    path: "{{ pihole_data_dir }}/etc-pihole"
  register: pihole_data_dir_stat

- name: Create the Pi-hole data directory (first run only)
  ansible.builtin.file:
    path: "{{ pihole_data_dir }}/etc-pihole"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not pihole_data_dir_stat.stat.exists

# The UI password lives in a Podman secret, not in the unit or the container
# env shown by `podman inspect` (captain review on #27). The current value is
# read back on the host and compared without logging, so no fingerprint of the
# password is stored anywhere (captain follow-up on #35).
- name: Read the current Pi-hole secret value (never logged)
  ansible.builtin.command:
    cmd: >-
      podman secret inspect --showsecret --format
      '{% raw %}{{ .SecretData }}{% endraw %}' {{ pihole_secret_name }}
  register: pihole_secret_current
  changed_when: false
  failed_when: false
  no_log: true

- name: Create or replace the Pi-hole password secret when it differs
  ansible.builtin.command:
    cmd: podman secret create --replace {{ pihole_secret_name }} -
    stdin: "{{ pihole_web_password }}"
    stdin_add_newline: false
  when: pihole_secret_current.rc != 0 or pihole_secret_current.stdout != pihole_web_password
  changed_when: true
  notify: Restart Pi-hole
  no_log: true

- name: Install the Pi-hole Quadlet
  ansible.builtin.template:
    src: pihole.container.j2
    dest: /etc/containers/systemd/pihole.container
    owner: root
    group: root
    mode: "0600"
  notify: Restart Pi-hole

- name: Generate the Quadlet service
  ansible.builtin.systemd_service:
    daemon_reload: true

# Quadlet units are generated, so they cannot be "enabled"; [Install] in the
# .container file starts it at boot.
- name: Start Pi-hole
  ansible.builtin.systemd_service:
    name: pihole.service
    state: started
