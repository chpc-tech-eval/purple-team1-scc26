---
# EXAMPLE inventory for CI and for copying. Every address below is a FAKE
# documentation address (RFC 5737 TEST-NET); none is part of the real topology.
# Copy to inventories/private/hosts.yml (gitignored) and use `terraform output`.
# Never put real addresses, ranges or topology in Git (instructor review, #23).
all:
  vars:
    ansible_user: rocky  # Rocky 9 cloud-image bootstrap user (#16)
  children:
    edge_nodes:
      hosts:
        edge-01:
          ansible_host: 203.0.113.10
    # Hosts behind the edge; the private inventory adds the edge-01 ProxyJump
    # for this group (see ../../README.md, "Private inventory").
    private_nodes:
      children:
        api_lb:
          hosts:
            api-lb-01:
              ansible_host: 198.51.100.10
        control_plane:
          hosts:
            k8s-cp-01:
              ansible_host: 198.51.100.11
        workers:
          hosts:
            k8s-worker-01:
              ansible_host: 198.51.100.21
            k8s-worker-02:
              ansible_host: 198.51.100.22
