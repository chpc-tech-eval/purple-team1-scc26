---
# EXAMPLE inventory: placeholders only. Copy to inventories/private/hosts.yml
# (gitignored) and fill in real addresses from `terraform output`.
# Private CIDRs are pending instructor confirmation (#21); do not hard-code them here.
all:
  vars:
    ansible_user: rocky  # Rocky 9 cloud-image bootstrap user (#16)
  children:
    edge_nodes:
      hosts:
        edge-01:
          ansible_host: "<edge-floating-ip>"
    # Everything behind the edge is reached through edge-01 (see group_vars/private_nodes.yml).
    private_nodes:
      children:
        api_lb:
          hosts:
            api-lb-01:
              ansible_host: "<api-lb-private-ip>"
        control_plane:
          hosts:
            k8s-cp-01:
              ansible_host: "<cp-private-ip>"
        workers:
          hosts:
            k8s-worker-01:
              ansible_host: "<worker1-private-ip>"
            k8s-worker-02:
              ansible_host: "<worker2-private-ip>"
