---
# Edge services: nftables, WireGuard, Pi-hole (Week 1, #13) and Suricata IDS (Week 3 Part B, #65).
# Run: ansible-playbook -i inventories/private/hosts.yml playbooks/edge.yml --tags wireguard,pihole,firewall
# Firewall first, so the WireGuard port and DNS are allowed before they start.
- name: Configure edge services
  hosts: edge_nodes
  become: true
  roles:
    - role: firewall
      tags: [firewall]
    - role: wireguard
      tags: [wireguard]
    - role: pihole
      tags: [pihole]
    - role: suricata
      tags: [suricata]
