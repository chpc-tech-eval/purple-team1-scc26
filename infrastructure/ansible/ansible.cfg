[defaults]
# Real inventory is private and gitignored; CI and local checks pass
# -i inventories/example/hosts.yml explicitly.
inventory = inventories/private/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
result_format = yaml
timeout = 30

[privilege_escalation]
become_method = sudo

[ssh_connection]
# accept-new: trust a host key the first time, refuse if it later changes.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
