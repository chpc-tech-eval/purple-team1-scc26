# Wazuh indexer/dashboard/API credentials, SEALED. Plaintext only in the captain's private dir.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wazuh-creds
  namespace: wazuh
spec:
  encryptedData:
    API_PASSWORD: 
    API_USERNAME: 
    DASHBOARD_PASSWORD: 
    DASHBOARD_USERNAME: 
    FILEBEAT_PASSWORD: 
    FILEBEAT_USERNAME: 
    INDEXER_PASSWORD: 
    INDEXER_USERNAME: 
    WAZUH_API_URL: 
    internal_users.yml: 
  template:
    metadata:
      name: wazuh-creds
      namespace: wazuh
    type: Opaque
