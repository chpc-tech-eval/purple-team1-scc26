# Hermes worker: CPU only, no Kubernetes token, no shell tool, one fixed read-only
# diagnostic, one explicit remote model route (week4 §2). Profile on a retained PVC.
apiVersion: v1
kind: Service
metadata:
  namespace: agent-control-plane
  name: agent-control-plane-hermes
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: agent-control-plane
    acp-role: worker
  ports:
  - name: unused
    port: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-control-plane-hermes
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  serviceName: agent-control-plane-hermes
  # Singleton by design (week4 §8; the worker also takes a DB advisory lock). Started
  # now that the model route (acp-config) and its sealed key (acp-model) exist.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: worker
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      annotations:
        # Bump when worker-patch.yaml changes: a ConfigMap edit alone doesn't restart
        # the worker, and the launcher is only read at start-up.
        purple-team1/worker-patch-revision: "2"
      labels:
        app.kubernetes.io/part-of: agent-control-plane
        acp-role: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: hermes-worker
        # Built from the same upstream commit as the API image (dab5e4c, tag sha-dab5e4c…):
        # the API's migration takes the DB to schema 4, and this build accepts {3, 4}.
        # (609dd6a8, the earlier pin, accepted exactly 3 and crash-looped.) Keep the two
        # images on the same upstream commit when bumping either.
        image: ghcr.io/nyameko/agent-control-plane-hermes@sha256:73fbc34301e9cd700e6fbb5cb6ba1f46018e1a9c22a439fdda5f81c56433f9c5
        # Upstream runs `python -m agent_control_plane.worker`; the launcher from
        # worker-patch.yaml points its diagnostic at student-platform, then runs it.
        command:
        - python
        - /opt/acp-patch/run_worker.py
        envFrom:
        - configMapRef:
            name: acp-config
        env:
        - name: ACP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acp-db-app
              key: ACP_DATABASE_URL
        - name: ACP_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: acp-model
              key: ACP_MODEL_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: profile
          mountPath: /var/lib/hermes
        - name: tmp
          mountPath: /tmp
        - name: worker-patch
          mountPath: /opt/acp-patch
          readOnly: true
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-worker-heartbeat').st_mtime<30
          initialDelaySeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-worker-heartbeat').st_mtime<60
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: worker-patch
        configMap:
          name: acp-worker-patch
  volumeClaimTemplates:
  - metadata:
      name: profile
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: cinder-agent-retain
      resources:
        requests:
          storage: 10Gi
