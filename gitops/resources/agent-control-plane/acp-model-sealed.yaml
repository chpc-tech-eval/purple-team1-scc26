# Hermes worker -> LiteLLM credential (ACP_MODEL_API_KEY = the model-serving LiteLLM
# master key; no per-client keys without a LiteLLM database). SEALED; plaintext stays in
# the member's ~/.config/scc26-secrets, never in Git.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: acp-model
  namespace: agent-control-plane
spec:
  encryptedData:
    ACP_MODEL_API_KEY: 
  template:
    metadata:
      name: acp-model
      namespace: agent-control-plane
