# ACP JWT verification key (public half of the Student Platform signing key), SEALED for consistency.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: acp-verification
  namespace: agent-control-plane
spec:
  encryptedData:
    public.pem: 
  template:
    metadata:
      name: acp-verification
      namespace: agent-control-plane
    type: Opaque
