# ACP restricted app credential (acp_app role, API + worker), SEALED.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: acp-db-app
  namespace: agent-control-plane
spec:
  encryptedData:
    ACP_APP_PASSWORD: 
    ACP_DATABASE_URL: 
  template:
    metadata:
      name: acp-db-app
      namespace: agent-control-plane
    type: Opaque
