# ACP schema-owner credential (migration job + PostgreSQL init), SEALED. Plaintext only in the captain's private dir.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: acp-db-owner
  namespace: agent-control-plane
spec:
  encryptedData:
    ACP_MIGRATION_DATABASE_URL: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: acp-db-owner
      namespace: agent-control-plane
    type: Opaque
