# Bootstrap chain: self-signed issuer -> team CA certificate -> CA ClusterIssuer.
# Workloads request TLS with the annotation
#   cert-manager.io/cluster-issuer: pt1-internal-ca
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pt1-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pt1-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: 3NCRYP+3D pt1.internal CA
  secretName: pt1-internal-ca
  duration: 8760h  # 1 year, POC lifetime
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: pt1-selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pt1-internal-ca
spec:
  ca:
    secretName: pt1-internal-ca
