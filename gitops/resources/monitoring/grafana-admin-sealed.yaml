# Grafana admin credential, SEALED for this cluster's Sealed Secrets key.
# Plaintext lives only in the captain's private secrets directory.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
    type: Opaque
