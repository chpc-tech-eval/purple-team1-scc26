# PostgreSQL credential for the student platform, SEALED for this cluster.
# Plaintext lives only in the captain's private secrets directory.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: student-platform
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-credentials
      namespace: student-platform
    type: Opaque
