# Student Project Platform (week3 §10-14): CI-built image from GHCR, deployed
# by Argo. Credentials come only from SealedSecrets (postgres-credentials,
# platform-seed); the browser talks to this app, never to the database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: student-platform
  labels: {app: platform}
spec:
  replicas: 2
  selector:
    matchLabels: {app: platform}
  template:
    metadata:
      labels: {app: platform}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Group-readable mounted secrets (the ACP signing key) for the app user only.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          # Immutable CI tag + digest (week3 §11), from platform-image run 41403471681 (commit 00ccb01, #98 Crypty).
          image: ghcr.io/saxs-14/scc26-student-platform:sha-00ccb01cc7f6@sha256:7c936d7ad7fe3c9e45f02f8c42e04ee3f94dba7ad0fc30355eb5c9d72dea35dd
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: platform-seed
          env:
            - name: POSTGRES_HOST
              value: postgres
            # Crypty (Week 4, #98): server-side ACP client. Only this backend holds the
            # signing key; the browser never sees ACP, the key or an assertion.
            - name: ACP_URL
              value: http://agent-control-plane-api.agent-control-plane.svc.cluster.local:8080
            - name: ACP_TENANT_ID
              value: purple-team1
            - name: ACP_ALLOWED_USERS
              value: phathutshedzo,olerato,siyabonga,rendani
            - name: ACP_SIGNING_KEY_FILE
              value: /var/run/acp/private.pem
          volumeMounts:
            - name: acp-signing
              mountPath: /var/run/acp
              readOnly: true
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: acp-signing
          secret:
            secretName: acp-signing
            defaultMode: 0440
            items:
              - {key: private.pem, path: private.pem}
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  namespace: student-platform
  labels: {app: platform}
spec:
  selector: {app: platform}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Browser path (week3 §14): Pi-hole name -> team-CA TLS -> Traefik -> app -> PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: student-platform
  annotations:
    cert-manager.io/cluster-issuer: pt1-internal-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [platform.pt1.internal]
      secretName: platform-tls
  rules:
    - host: platform.pt1.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform
                port:
                  number: 80
---
# Prometheus (Part A) scrapes the app's bounded counters.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform
  namespace: student-platform
spec:
  selector:
    matchLabels: {app: platform}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
