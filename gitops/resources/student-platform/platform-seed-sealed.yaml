# Platform login accounts, SEALED for this cluster. Plaintext only in the captain's private dir.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: platform-seed
  namespace: student-platform
spec:
  encryptedData:
    PLATFORM_SEED_USERS: 
  template:
    metadata:
      name: platform-seed
      namespace: student-platform
    type: Opaque
