# Student Platform ACP signing key (Ed25519 private). Only the platform backend mounts it; SEALED.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: acp-signing
  namespace: student-platform
spec:
  encryptedData:
    private.pem: 
  template:
    metadata:
      name: acp-signing
      namespace: student-platform
    type: Opaque
