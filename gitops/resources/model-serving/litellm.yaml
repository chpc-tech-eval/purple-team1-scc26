# LiteLLM: the single OpenAI-style endpoint for the cluster's LLM clients (the ACP
# worker, Hermes). It forwards to llama.cpp and enforces its own master key.
# No database (no per-client virtual keys, no spend tracking): one client, one key.
# No internet: bundled model cost map, egress limited by NetworkPolicy. The admin UI
# pages are still served (DISABLE_ADMIN_UI has no effect in this version, tested), but
# only Hermes can reach this Service and every API call needs the master key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: model-serving
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  config.yaml: |
    model_list:
      # The name clients ask for is the real model name (ACP records always name the
      # real model). Keep it equal to the image's MODEL_ALIAS.
      - model_name: qwen2.5-0.5b-instruct
        litellm_params:
          model: openai/qwen2.5-0.5b-instruct
          api_base: os.environ/LLAMA_API_BASE
          api_key: os.environ/LLAMA_API_KEY
          timeout: 170
    litellm_settings:
      drop_params: true
      num_retries: 0
      request_timeout: 175
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: model-serving
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: model-serving
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: litellm
        # Upstream non-root image (runs as 65534), pinned by digest; built 2026-05-02.
        image: ghcr.io/berriai/litellm-non_root:main-v1.83.14-stable@sha256:5bb1d45eefe9b8bdc8d1b34617b8112d03bfc78fc247bea62d7ebd89918c875c
        args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
        ports:
        - name: http
          containerPort: 4000
        env:
        - name: LLAMA_API_BASE
          value: http://llama-cpp.model-serving.svc.cluster.local:8080/v1
        - name: LLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-serving-keys
              key: LLAMA_API_KEY
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: model-serving-keys
              key: LITELLM_MASTER_KEY
        - name: LITELLM_LOCAL_MODEL_COST_MAP
          value: "True"
        resources:
          # Measured locally: ~955 MiB RSS after startup and a first request.
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1536Mi
        # /health/liveliness and /health/readiness need no key.
        startupProbe:
          httpGet:
            path: /health/liveliness
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: http
          periodSeconds: 20
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: config
        configMap:
          name: litellm-config
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: cache
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: model-serving
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
  - name: http
    port: 4000
    targetPort: http
