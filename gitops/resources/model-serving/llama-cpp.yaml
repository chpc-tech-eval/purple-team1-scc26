# llama.cpp server with the model baked into the image (model-serving/Dockerfile, #107).
# Only LiteLLM may call it (NetworkPolicy + API key). The image digest comes from the
# model-image CI run on dev after #107 merged (dev 537c5c0; smoke test: no network, uid 10001).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: model-serving
  labels:
    app.kubernetes.io/name: llama-cpp
    app.kubernetes.io/part-of: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
        app.kubernetes.io/part-of: model-serving
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: llama-cpp
        image: ghcr.io/saxs-14/scc26-model-server:sha-537c5c0de2f6@sha256:1c05eb08dfc16bdb05e0eef5e3cef630259e9dadffe48ac1bcf93154145d394a
        ports:
        - name: http
          containerPort: 8080
        env:
        # The image sets model, alias, host, port and context via LLAMA_ARG_*;
        # threads must match the CPU limit below.
        - name: LLAMA_ARG_THREADS
          value: "4"
        # NOTE: llama-server reads the key from LLAMA_API_KEY (no ARG_). Tested:
        # LLAMA_ARG_API_KEY is silently ignored and leaves the server open.
        - name: LLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-serving-keys
              key: LLAMA_API_KEY
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 1Gi
        # /health needs no key, so the kubelet can probe it.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  namespace: model-serving
  labels:
    app.kubernetes.io/name: llama-cpp
    app.kubernetes.io/part-of: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: llama-cpp
  ports:
  - name: http
    port: 8080
    targetPort: http
