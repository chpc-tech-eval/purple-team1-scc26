# LiteLLM master key + llama.cpp API key, SEALED with the cluster controller's cert.
# Plaintext stays in the author's ~/.config/scc26-secrets/, never in Git.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: model-serving-keys
  namespace: model-serving
spec:
  encryptedData:
    LITELLM_MASTER_KEY: 
    LLAMA_API_KEY: 
  template:
    metadata:
      name: model-serving-keys
      namespace: model-serving
    type: Opaque
