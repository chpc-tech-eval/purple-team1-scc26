# Default deny, then only: DNS; LiteLLM -> llama.cpp :8080; the ACP worker (Hermes)
# -> LiteLLM :4000. Nothing here may reach the internet: the model is baked into the
# image and LiteLLM uses its bundled cost map (LITELLM_LOCAL_MODEL_COST_MAP).
# The matching egress rule on the ACP side (worker -> LiteLLM) is added in step 3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-serving-default-deny
  namespace: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-serving-dns
  namespace: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-cpp-from-litellm
  namespace: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-to-llama-cpp
  namespace: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: llama-cpp
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-from-acp-worker
  namespace: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-control-plane
      podSelector:
        matchLabels:
          app.kubernetes.io/part-of: agent-control-plane
          acp-role: worker
    ports:
    - protocol: TCP
      port: 4000
