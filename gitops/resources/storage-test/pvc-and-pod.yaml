# Persistence test: write a marker, delete/recreate the POD (not the PVC),
# read the marker back (week2/README.md §16).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: persistence-test
  namespace: storage-test
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cinder-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: persistence-test
  namespace: storage-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      # explicit registry + index digest (week1/README.md §21)
      image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: ["sh", "-c", "sleep 3600000"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: persistence-test
