# Persistence exercise (week2/README.md §16): a Git-managed 1Gi PVC and a test
# pod. Kept permanently: nothing that ran on the servers is removed (team rule).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: storage-test
  source:
    repoURL: https://github.com/chpc-tech-eval/purple-team1-scc26.git
    targetRevision: dev
    path: gitops/resources/storage-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
