# Week-3 Part C (week3/README.md §9-14, #66): Student Project Platform.
# Order from §12: namespace -> sealed credential -> PostgreSQL on a Cinder PVC
# -> backend -> frontend -> Service/Ingress/TLS. The database comes first; the
# backend and frontend are added to gitops/resources/student-platform later.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: student-platform
  source:
    repoURL: https://github.com/chpc-tech-eval/purple-team1-scc26.git
    targetRevision: dev
    path: gitops/resources/student-platform
  syncPolicy:
    # Pod Security on the defended namespace. enforce=baseline blocks the pods an
    # attacker would want (privileged, hostNetwork/PID/IPC, hostPath, dangerous
    # capabilities); warn/audit=restricted surface the gap to the stricter level,
    # which both current workloads (platform, postgres) already meet, so enforce can
    # be raised to restricted once a sync confirms it.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: latest
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
