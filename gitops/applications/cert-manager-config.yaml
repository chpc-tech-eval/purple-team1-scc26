# Team issuers (Part F §17): a private CA for the internal domain pt1.internal
# (#13). Public ACME cannot issue for .internal names. The CA private key is
# generated by cert-manager inside the cluster and never enters Git.
# Needs the cert-manager CRDs: until they exist the dry run is skipped and the
# sync retries, which is the only ordering this needs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  source:
    repoURL: https://github.com/chpc-tech-eval/purple-team1-scc26.git
    targetRevision: dev
    path: gitops/resources/cert-manager-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
