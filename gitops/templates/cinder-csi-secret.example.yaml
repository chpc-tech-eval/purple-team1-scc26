# TEMPLATE ONLY (week2/README.md §14). Copy to ~/.config/scc26-secrets/,
# fill in the Cinder application credential there, seal it with kubeseal and
# commit ONLY the SealedSecret. Never commit a filled-in copy of this file.
#
#   cp gitops/templates/cinder-csi-secret.example.yaml ~/.config/scc26-secrets/cinder-csi-secret.yaml
#   chmod 600 ~/.config/scc26-secrets/cinder-csi-secret.yaml
#   kubeseal --cert ~/.config/scc26-secrets/3ncryp3d-sealed-secrets.cert --format yaml \
#     < ~/.config/scc26-secrets/cinder-csi-secret.yaml \
#     > gitops/resources/cinder-csi/cinder-csi-cloud-config-sealed.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cinder-csi-cloud-config
  namespace: kube-system
type: Opaque
stringData:
  cloud.conf: |
    [Global]
    auth-url=https://<keystone-host>:5000/v3
    application-credential-id=<cinder-app-credential-id>
    application-credential-secret=<cinder-app-credential-secret>
    region=RegionOne
