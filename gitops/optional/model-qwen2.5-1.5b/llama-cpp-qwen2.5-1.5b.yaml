# OPTIONAL, NOT DEPLOYED. See README.md in this folder before using.
#
# A second llama.cpp server for Qwen2.5-1.5B-Instruct, to run NEXT TO the 0.5B one
# (gitops/resources/model-serving/llama-cpp.yaml), not instead of it. Argo CD does not
# read gitops/optional/, so this file changes nothing until someone copies it into
# gitops/resources/model-serving/ in a reviewed PR.
#
# Differences from the 0.5B Deployment: its own name and label (so the existing
# `llama-cpp` Service and NetworkPolicies never select it), more memory for the larger
# model, and the image placeholder below, which is deliberately invalid: a pod made from
# this file before the 1.5B image is built fails with InvalidImageName instead of
# running the wrong model.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-qwen2-5-1-5b
  namespace: model-serving
  labels:
    app.kubernetes.io/name: llama-cpp-qwen2-5-1-5b
    app.kubernetes.io/part-of: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp-qwen2-5-1-5b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp-qwen2-5-1-5b
        app.kubernetes.io/part-of: model-serving
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: llama-cpp
        # Replace with the digest from the model-image CI run that built the 1.5B
        # image (README step 1), e.g. ghcr.io/saxs-14/scc26-model-server:sha-<12>@sha256:<64>.
        image: ghcr.io/saxs-14/scc26-model-server@sha256:REPLACE-WITH-THE-1.5B-BUILD-DIGEST
        ports:
        - name: http
          containerPort: 8080
        env:
        # The image sets model, alias (qwen2.5-1.5b-instruct), host, port and the 4096
        # context via LLAMA_ARG_*; threads must match the CPU limit below.
        - name: LLAMA_ARG_THREADS
          value: "4"
        # Same key as the 0.5B server: only LiteLLM holds it.
        - name: LLAMA_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-serving-keys
              key: LLAMA_API_KEY
        resources:
          # Model file ~1.1 GB (vs ~0.5 GB) plus KV cache and buffers. Not yet measured:
          # check `kubectl top pod` after the first runs and tighten. Each worker node
          # has 8 CPUs / 16 GB allocatable.
          requests:
            cpu: "1"
            memory: 1536Mi
          limits:
            cpu: "4"
            memory: 3Gi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-qwen2-5-1-5b
  namespace: model-serving
  labels:
    app.kubernetes.io/name: llama-cpp-qwen2-5-1-5b
    app.kubernetes.io/part-of: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: llama-cpp-qwen2-5-1-5b
  ports:
  - name: http
    port: 8080
    targetPort: http
---
# Same rules as the 0.5B server: only LiteLLM may call it, and LiteLLM may call it.
# (The namespace's default-deny stays in force for everything else.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-cpp-qwen2-5-1-5b-from-litellm
  namespace: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp-qwen2-5-1-5b
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-to-llama-cpp-qwen2-5-1-5b
  namespace: model-serving
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: llama-cpp-qwen2-5-1-5b
    ports:
    - protocol: TCP
      port: 8080
