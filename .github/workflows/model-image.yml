# CPU model-server image (#94: LiteLLM -> llama.cpp on CPU; no A100 dependency).
# A tiny open-weight GGUF is baked in at build time -> OCI image -> GHCR immutable
# sha-<commit> tag. Pull requests build + smoke-test only; a merge into dev also pushes.
# The running container needs no internet egress and holds no credentials.
#
# Registry: the org denies package creation to this repo's GITHUB_TOKEN (#79), so the
# image publishes under the captain's GHCR namespace with the repo secret GHCR_TOKEN.
name: model-image

on:
  pull_request:
    branches: [dev, main]
    paths: ["model-serving/**", ".github/workflows/model-image.yml"]
  push:
    branches: [dev]
    paths: ["model-serving/**", ".github/workflows/model-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/saxs-14/scc26-model-server
  REGISTRY_USER: saxs-14

jobs:
  test-build:
    name: model image build + smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image (bakes the GGUF; immutable sha tag)
        working-directory: model-serving
        run: |
          short="${GITHUB_SHA::12}"
          docker build -t "${IMAGE}:sha-${short}" .
          echo "TAG=sha-${short}" >> "$GITHUB_ENV"

      - name: Smoke test — the baked model answers with no network, as non-root (CPU)
        run: |
          # --network none: the container gets only a loopback interface, so a passing
          # test proves the model is served from the image with zero egress. The
          # requests run INSIDE the container (curl is in the image) because a
          # container without a network can't publish a port to the runner.
          docker run -d --name smoke --network none "${IMAGE}:${TAG}"
          api() { docker exec smoke curl -fsS "$@"; }
          ok=""
          for i in $(seq 1 60); do
            if api http://127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::model server did not become healthy"; docker logs smoke; docker rm -f smoke; exit 1; fi
          # Offline and non-root, asserted rather than claimed.
          nets="$(docker exec smoke ls /sys/class/net | tr '\n' ' ')"
          [ "$nets" = "lo " ] || { echo "::error::expected only loopback, got: $nets"; exit 1; }
          uid="$(docker exec smoke id -u)"
          [ "$uid" != "0" ] || { echo "::error::model server runs as root"; exit 1; }
          # OpenAI-compatible surface LiteLLM will route to; the model name is read back, not assumed.
          model="$(api http://127.0.0.1:8080/v1/models | jq -r '.data[0].id')"
          [ -n "$model" ] && [ "$model" != "null" ] || { echo "::error::no model listed"; exit 1; }
          body="$(jq -nc --arg m "$model" '{model: $m, messages: [{role: "user", content: "Reply with the single word: pong"}], max_tokens: 16, temperature: 0}')"
          resp="$(api http://127.0.0.1:8080/v1/chat/completions -H 'Content-Type: application/json' -d "$body")"
          echo "$resp"
          echo "$resp" | jq -e '.choices[0].message.content | length > 0' >/dev/null \
            || { echo "::error::empty completion"; exit 1; }
          echo "ok: model=${model} uid=${uid} interfaces=${nets}"
          docker rm -f smoke

      - name: Push to GHCR (dev only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then echo "::error::repo secret GHCR_TOKEN is not set (see #79)"; exit 1; fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "${IMAGE}:${TAG}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          {
            echo "### CPU model-server image"
            echo ""
            echo "- tag: \`${IMAGE}:${TAG}\`"
            echo "- digest: \`${digest}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "Set the llama.cpp Deployment image to the digest above in a gitops PR."
          } >> "$GITHUB_STEP_SUMMARY"
